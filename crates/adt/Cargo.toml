[package]
name = "goat-adt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ADT protocol support for the goat ABAP tooling framework"
repository = "https://github.com/kennyhml/goat"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[dependencies]
async-lock = "3.4"
async-trait = "0.1.88"
cookie = "0.18"
derive_builder = "0.20"
http = "1.3"
reqwest = { version = "0.12", features = ["cookies"], optional = true }
readonly = "0.2.13"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.8.1"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
