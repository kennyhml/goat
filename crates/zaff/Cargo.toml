[package]
name = "zaff"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ABAP file-format projection for the Ziege tooling framework"
repository = "https://github.com/kennyhml/ziege"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zadt = { path = "../zadt", default-features = false }

[dev-dependencies]
http = "1.0"
