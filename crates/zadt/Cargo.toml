[package]
name = "zadt"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ADT protocol support for the Ziege ABAP tooling framework"
repository = "https://github.com/kennyhml/ziege"

[[example]]
name = "transports"
required-features = ["reqwest"]

[features]
default = ["reqwest"]
logging = ["dep:quick-xml", "dep:tracing"]
reqwest = ["dep:reqwest"]

[dependencies]
async-lock = "3.4"
async-trait = "0.1.88"
cookie = "0.18"
derive_builder = "0.20"
http = "1.3"
httparse = "=1.10.1"
quick-xml = { version = "0.38", optional = true }
reqwest = { version = "0.12", features = ["cookies"], optional = true }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.8.1"
std-uritemplate = "2.0"
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
