[package]
name = "zvfs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lazy ADT repository trees for the Ziege ABAP tooling framework"
repository = "https://github.com/kennyhml/ziege"

[dependencies]
async-lock = "3.4"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
zadt = { path = "../zadt", default-features = false }

[dev-dependencies]
async-trait = "0.1.88"
http = "1.3"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
